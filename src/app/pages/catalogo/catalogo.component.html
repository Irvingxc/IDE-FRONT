<div class="catalogo-page">

  <div class="page-header">
    <mat-icon class="page-icon">price_change</mat-icon>
    <div class="page-header-text">
      <h1 class="page-title">Catálogo de Precios</h1>
      <p class="page-sub">Precios por grado y producto</p>
    </div>
    <button mat-raised-button color="primary" class="btn-nuevo" (click)="nuevoProducto()">
      <mat-icon>add</mat-icon> Nuevo Producto
    </button>
  </div>

  <!-- Vigencia / factor -->
  <div class="vigencia-bar">
    <label class="vig-field">
      <span>Programar como nueva vigencia desde</span>
      <input type="date" [(ngModel)]="vigenciaDesde">
    </label>
    <span class="vig-hint" *ngIf="vigenciaDesde">
      Al guardar se cierra el precio anterior el día previo y arranca el nuevo en esa fecha.
    </span>
    <span class="vig-hint" *ngIf="!vigenciaDesde">
      Sin fecha: se edita el precio vigente en el momento.
    </span>
    <span class="vig-sep"></span>
    <label class="vig-field">
      <span>Aplicar % a la vista</span>
      <input type="number" step="0.5" [(ngModel)]="factorPct" placeholder="ej. 10">
    </label>
    <button mat-stroked-button (click)="aplicarFactor()" [disabled]="factorPct == null">Aplicar</button>
  </div>

  <!-- Filtro nivel -->
  <div class="filtro-bar">
    <button mat-stroked-button
            [class.activo]="!nivelFiltro"
            (click)="nivelFiltro = ''">Todos</button>
    <button mat-stroked-button
            *ngFor="let n of niveles"
            [class.activo]="nivelFiltro === n"
            (click)="nivelFiltro = n">{{ n }}</button>
  </div>

  <!-- Spinner -->
  <div class="loading" *ngIf="cargando">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Tabla -->
  <div class="table-card" *ngIf="!cargando">
    <table mat-table [dataSource]="filasFiltradas">

      <!-- Nivel -->
      <ng-container matColumnDef="nivel">
        <th mat-header-cell *matHeaderCellDef>Nivel</th>
        <td mat-cell *matCellDef="let row">
          <span class="nivel-chip" [attr.data-nivel]="row.nivel">{{ row.nivel }}</span>
        </td>
      </ng-container>

      <!-- Grado -->
      <ng-container matColumnDef="grado">
        <th mat-header-cell *matHeaderCellDef>Grado</th>
        <td mat-cell *matCellDef="let row">
          <strong>{{ row.nombre }}</strong>
        </td>
      </ng-container>

      <!-- Columna dinámica por producto -->
      <ng-container *ngFor="let prod of productos" [matColumnDef]="'p_' + prod.id">
        <th mat-header-cell *matHeaderCellDef>
          <div class="prod-header">
            <span>{{ prod.nombre }}</span>
            <button mat-icon-button class="btn-inactivar"
                    matTooltip="Inactivar producto"
                    (click)="confirmarInactivar(prod)">
              <mat-icon>block</mat-icon>
            </button>
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="precio-input-wrap">
            <span class="lempira">L.</span>
            <input class="precio-input"
                   type="number"
                   min="0"
                   [(ngModel)]="getPrecio(row, prod.id).precio"
                   [class.editado]="getPrecio(row, prod.id).precio !== getPrecio(row, prod.id).original">
          </div>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="acciones" *ngIf="row.modificado; else sinCambios">
            <button mat-flat-button color="primary"
                    [disabled]="row.guardando"
                    (click)="guardar(row)">
              <mat-icon>save</mat-icon>
              {{ row.guardando ? 'Guardando...' : 'Guardar' }}
            </button>
            <button mat-icon-button matTooltip="Cancelar cambios"
                    (click)="cancelar(row)">
              <mat-icon>close</mat-icon>
            </button>
          </div>
          <ng-template #sinCambios>
            <mat-icon class="ok-icon" matTooltip="Sin cambios">check_circle</mat-icon>
          </ng-template>
          <button mat-icon-button matTooltip="Historial de precios" (click)="verHistorial(row)">
            <mat-icon>history</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"
          [class.fila-modificada]="row.modificado"></tr>

    </table>
  </div>

</div>
