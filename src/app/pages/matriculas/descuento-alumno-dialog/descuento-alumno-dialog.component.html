<h2 mat-dialog-title>Descuento mensual — {{ alumno.nombreCompleto }}</h2>

<mat-dialog-content [formGroup]="form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Descuento (%)</mat-label>
    <input matInput type="number" formControlName="descuento" min="0" max="100" step="1">
    <span matSuffix>%</span>
    <mat-icon matPrefix>money_off</mat-icon>
    <mat-hint>0 = sin descuento &nbsp;|&nbsp; 100 = gratuito</mat-hint>
    <mat-error *ngIf="form.get('descuento')?.hasError('min')">No puede ser negativo</mat-error>
    <mat-error *ngIf="form.get('descuento')?.hasError('max')">Máximo 100%</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Motivo del descuento</mat-label>
    <textarea matInput formControlName="motivoDescuento" rows="3" placeholder="Ej. Beca por rendimiento académico"></textarea>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="loading || form.invalid">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
