<h2 mat-dialog-title>Cerrar Período</h2>

<mat-dialog-content>
  <div class="filtros">
    <mat-form-field appearance="outline">
      <mat-label>Año</mat-label>
      <input matInput type="number" [(ngModel)]="anio" (change)="cargarResumen()" min="2020" max="2099">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mes</mat-label>
      <mat-select [(ngModel)]="mes" (selectionChange)="cargarResumen()">
        <mat-option *ngFor="let m of meses" [value]="m.val">{{ m.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="resumen-area" *ngIf="cargandoResumen">
    <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
  </div>

  <div class="resumen-area" *ngIf="resumen && !cargandoResumen">
    <div class="alert alert-warn" *ngIf="resumen.yaCerrado">
      <mat-icon>lock</mat-icon>
      Este período ya fue cerrado.
    </div>

    <table class="resumen-table">
      <tr>
        <td>Total Ingresos</td>
        <td class="valor positivo">{{ formatLps(resumen.totalIngresos) }}</td>
      </tr>
      <tr>
        <td>Total Egresos</td>
        <td class="valor negativo">{{ formatLps(resumen.totalEgresos) }}</td>
      </tr>
      <tr class="resultado-row">
        <td>Resultado</td>
        <td class="valor" [class.positivo]="resumen.resultado >= 0" [class.negativo]="resumen.resultado < 0">
          {{ formatLps(resumen.resultado) }}
        </td>
      </tr>
    </table>

    <mat-form-field appearance="outline" class="obs-field" *ngIf="!resumen.yaCerrado">
      <mat-label>Observaciones (opcional)</mat-label>
      <textarea matInput [(ngModel)]="observaciones" rows="3" maxlength="500"></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()" [disabled]="guardando">Cancelar</button>
  <button mat-flat-button color="warn" (click)="confirmar()" [disabled]="!puedeConfirmar">
    <mat-icon>lock</mat-icon>
    Cerrar Período
  </button>
</mat-dialog-actions>
