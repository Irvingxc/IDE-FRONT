<h2 mat-dialog-title>
  <mat-icon style="vertical-align:middle;margin-right:8px">event_busy</mat-icon>
  Feriados / días no laborables
</h2>

<mat-dialog-content>

  <p class="ayuda">
    Los días registrados aquí no se cuentan como ausencia en el Reporte Mensual.
  </p>

  <div class="nuevo-feriado">
    <mat-form-field appearance="outline" class="campo-fecha">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="pickerNuevo" [(ngModel)]="nuevaFecha">
      <mat-datepicker-toggle matSuffix [for]="pickerNuevo"></mat-datepicker-toggle>
      <mat-datepicker #pickerNuevo></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-desc">
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="nuevaDescripcion" maxlength="150" placeholder="Ej. Día del Trabajo" (keyup.enter)="agregar()">
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="agregar()" [disabled]="guardando">
      <mat-icon>add</mat-icon> Agregar
    </button>
  </div>

  <div *ngIf="loading" class="loading-row">
    <mat-icon class="spin-icon">sync</mat-icon>
    <span>Cargando...</span>
  </div>

  <table mat-table [dataSource]="feriados" class="tabla-feriados" *ngIf="!loading">
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let row">{{ row.fecha | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="warn" (click)="eliminar(row)" title="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    <tr class="mat-row no-data-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="columnas.length">
        <span>No hay feriados registrados.</span>
      </td>
    </tr>
  </table>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
