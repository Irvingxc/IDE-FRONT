<h2 mat-dialog-title>
  <mat-icon style="vertical-align:middle;color:#6B0F1A;margin-right:8px">event_note</mat-icon>
  {{ esEdicion ? 'Editar periodo' : 'Nuevo periodo' }}
</h2>

<mat-dialog-content [formGroup]="form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nombre del periodo</mat-label>
    <input matInput formControlName="nombre" placeholder="Ej. I Parcial">
    <mat-error>Requerido</mat-error>
  </mat-form-field>

  <div class="fechas-row">
    <mat-form-field appearance="outline">
      <mat-label>Fecha desde</mat-label>
      <input matInput [matDatepicker]="pickerDesde" formControlName="fechaDesde">
      <mat-datepicker-toggle matSuffix [for]="pickerDesde"></mat-datepicker-toggle>
      <mat-datepicker #pickerDesde></mat-datepicker>
      <mat-error>Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha hasta</mat-label>
      <input matInput [matDatepicker]="pickerHasta" formControlName="fechaHasta">
      <mat-datepicker-toggle matSuffix [for]="pickerHasta"></mat-datepicker-toggle>
      <mat-datepicker #pickerHasta></mat-datepicker>
      <mat-error>Requerido</mat-error>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Año lectivo</mat-label>
    <input matInput type="number" formControlName="anioLectivo">
    <mat-error>Requerido</mat-error>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cerrar()" [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="loading || form.invalid">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
