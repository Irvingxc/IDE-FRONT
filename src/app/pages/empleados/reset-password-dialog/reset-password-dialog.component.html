<h2 mat-dialog-title>
  <mat-icon style="vertical-align:middle;color:#6B0F1A;margin-right:8px">lock_reset</mat-icon>
  Cambiar contraseña de {{ data.nombreCompleto }}
</h2>

<mat-dialog-content [formGroup]="form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Contraseña nueva</mat-label>
    <input matInput type="password" formControlName="passwordNueva">
    <mat-error *ngIf="form.get('passwordNueva')?.hasError('required')">Requerido</mat-error>
  </mat-form-field>

  <app-password-requisitos [control]="form.get('passwordNueva')"></app-password-requisitos>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Confirmar contraseña nueva</mat-label>
    <input matInput type="password" formControlName="passwordConfirmar">
    <mat-error *ngIf="form.get('passwordConfirmar')?.hasError('required')">Requerido</mat-error>
  </mat-form-field>

  <p class="error-general" *ngIf="form.hasError('passwordsDistintas') && form.get('passwordConfirmar')?.value">
    Las contraseñas no coinciden.
  </p>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cerrar()" [disabled]="loading">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="loading || form.invalid">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
